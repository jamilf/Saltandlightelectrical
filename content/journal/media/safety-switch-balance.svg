<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320"><rect width="640" height="320" rx="2" fill="#0a2b5e"/><rect x="8.5" y="8.5" width="623" height="303" fill="none" stroke="#9dc1ee" stroke-opacity="0.4"/><text x="24" y="40" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="15" fill="#ffffff" font-weight="700">Balanced</text><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="#ffffff" d="M24 90H90M24 190H90"/><path stroke="#ffffff" d="M90 90H252V118M252 162V190H90"/><rect x="70" y="66" width="60" height="148" stroke="#9dc1ee"/><circle cx="252" cy="140" r="22" stroke="#ffffff"/><path stroke="#ffffff" d="M236 124L268 156M268 124L236 156"/><path stroke="#ffffff" d="M172 84L184 90L172 96M188 184L176 190L188 196"/></g><text x="84" y="236" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="13" fill="#9dc1ee">RCD</text><text x="24" y="276" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="13" fill="#9dc1ee">Out and back match,</text><text x="24" y="294" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="13" fill="#9dc1ee">so the power stays on.</text><text x="344" y="40" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="15" fill="#ffffff" font-weight="700">Leaking</text><g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="#ffffff" d="M344 90H410M344 190H410"/><path stroke="#ffffff" d="M410 90L426 76M410 190L426 176"/><path stroke="#9dc1ee" d="M432 90H572V118M572 162V190H432"/><rect x="390" y="66" width="60" height="148" stroke="#9dc1ee"/><circle cx="572" cy="140" r="22" stroke="#9dc1ee"/><path stroke="#9dc1ee" d="M556 124L588 156M588 124L556 156"/><path stroke="#9dc1ee" stroke-dasharray="6 5" d="M594 140H610V228"/><path stroke="#9dc1ee" d="M598 228H622M602 235H618M607 242H613"/></g><text x="404" y="236" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="13" fill="#9dc1ee">RCD</text><text x="344" y="276" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="13" fill="#9dc1ee">Some current leaks away,</text><text x="344" y="294" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="13" fill="#9dc1ee">so it turns the power off.</text></svg>
