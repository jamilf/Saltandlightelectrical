<footer class="site-footer">
  <div class="cores" aria-hidden="true"><span class="cores__active"></span><span class="cores__neutral"></span><span class="cores__earth"></span></div>
  <div class="wrap site-footer__inner">
    <p class="site-footer__brand">{{> mark }}<span>Salt and Light Electrical</span></p>
    <nav aria-label="Footer">
      <ul class="site-footer__links">
        {{#each nav}}<li><a href="{{ path }}">{{ label }}</a></li>
        {{/each}}
        <li><a href="/privacy/">Privacy</a></li>
        <li><a href="/rss.xml">RSS feed</a></li>
        {{#if person.linkedin}}<li><a href="{{ person.linkedin }}">LinkedIn</a></li>{{/if}}
      </ul>
    </nav>
    <p class="site-footer__meta">Drawn by {{ person.drawnBy }}. Revision {{ milestones.latest.rev }}, updated {{ milestones.latest.dateLabel }}.</p>
  </div>
</footer>
