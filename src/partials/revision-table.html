<div class="table-wrap">
  <table class="revisions">
    <caption class="visually-hidden">Revision history of drawing {{ milestones.drawing.number }}</caption>
    <thead>
      <tr><th scope="col">Revision</th><th scope="col">Date</th><th scope="col">What changed</th></tr>
    </thead>
    <tbody>
      {{#each milestones.revisions}}<tr><td>{{ rev }}</td><td><time datetime="{{ date }}">{{ dateLabel }}</time></td><td>{{ note }}</td></tr>
      {{/each}}
    </tbody>
  </table>
</div>
